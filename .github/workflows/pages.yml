# Every push to main: test, package both browsers, get the Firefox build
# signed by addons.mozilla.org (unlisted, from your AMO developer account),
# and publish the docs site with the downloads to GitHub Pages:
#   https://t3lluz.github.io/ChroMind/
#
# One-time setup:
#   Settings → Pages → Source: GitHub Actions
#   gh secret set AMO_JWT_ISSUER   (from https://addons.mozilla.org/developers/addon/api/key/)
#   gh secret set AMO_JWT_SECRET
# Without the secrets the site still deploys, offering the unsigned build.
name: Docs and packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:firefox
      - run: npm run pack
      - name: Sign the Firefox build on AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign:firefox
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
